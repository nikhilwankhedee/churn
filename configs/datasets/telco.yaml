# ============================================================================
# IBM Telco Customer Churn — Dataset Manifest
# ============================================================================
# Ecosystem: subscription
# Churn window: Native label (no inactivity-based labeling)
# Customers: ~7,043
# Source: IBM Sample Data Sets
# ============================================================================

adapter:
  type: telco
  plugin: null

root_directory: null

dataset:
  name: telco
  ecosystem_type: subscription
  citation: >
    IBM Sample Data Sets — Telco Customer Churn.
  source_url: "https://www.ibm.com/communities/analytics/watson-analytics-blog/generative-ai/"
  n_customers_approx: 7043

churn:
  strategy: subscription
  uses_native_churn_label: true
  prediction_window_days: null

features:
  available_groups:
    - static
    - monetary
    - cadence

schema:
  version: 2
  column_mapping:
    customerID: customer_id
    MonthlyCharges: transaction_value
    tenure: engagement_signal
    TotalCharges: total_charges
  synthetic_columns: {}

files:
  required:
    data: telco_customer_churn.csv
  optional: {}

preprocessing: {}
