# ======================================================================
# TELCO_ABLATION — Dataset Manifest
# ======================================================================
# Ecosystem: transactional_marketplace
# Churn window: 180 days
# Generated by: churn register / churn wizard
# 
adapter:
  type: generic
  plugin: null

root_directory: null

dataset:
  name: telco_ablation
  ecosystem_type: transactional_marketplace

churn:
  strategy: inactivity
  uses_native_churn_label: false
  prediction_window_days: 180
  justification: >
    180-day inactivity window for transactional marketplace.

features:
  available_groups:
    - purchase
    - monetary
    - inactivity

schema:
  version: 2
  column_mapping:
    customerID: customer_id
    PaymentMethod: transaction_value
  synthetic_columns: {}

files:
  required:
    data: customerID
  optional: {}

preprocessing:
  non_negative_columns:
    - TotalCharges

# WARNINGS:
#   - Could not auto-detect timestamp column — churn labeling requires timestamps
# 