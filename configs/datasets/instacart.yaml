# ============================================================================
# Instacart Grocery Delivery — Dataset Manifest
# ============================================================================
# Ecosystem: habitual_retail
# Churn window: 60 days
# Customers: ~200K | Orders: ~3M (sampled to 500K orders)
# Source: https://www.kaggle.com/c/instacart-market-basket-analysis
# ============================================================================

adapter:
  type: instacart
  plugin: null

root_directory: null

dataset:
  name: instacart
  ecosystem_type: habitual_retail
  citation: >
    Instacart Market Basket Analysis. Kaggle Competition.
  source_url: "https://www.kaggle.com/c/instacart-market-basket-analysis"
  n_customers_approx: 200000
  n_orders_approx: 3000000

churn:
  strategy: inactivity
  uses_native_churn_label: false
  prediction_window_days: 60
  justification: >
    60 days — Instacart has weekly/biweekly ordering cadence;
    60 days is ~4x median inter-purchase interval (~14 days).

features:
  available_groups:
    - purchase
    - monetary
    - inactivity
    - cadence

schema:
  version: 2
  column_mapping:
    user_id: customer_id
    purchase_value: transaction_value
    order_id: session_id
  synthetic_columns:
    event_type: purchase

files:
  required:
    orders: instacart_orders.csv
  optional:
    products: instacart_products.csv
    aisles: instacart_aisles.csv
    departments: instacart_departments.csv
    order_products_prior: instacart_order_products__prior.csv

preprocessing:
  synthetic_timestamp_epoch: '2017-03-21'
  max_orders_sample: 500000
  max_order_products_sample: 2000000
