# ============================================================================
# Churn Research Framework — Default Configuration
# ============================================================================
# This file defines all framework defaults. Every value here mirrors the
# hardcoded constants in src/config.py, ensuring identical behavior when
# no YAML is loaded.
#
# To customize: copy this file, modify values, pass path to the framework.
# When no YAML is provided, src/config.py constants are used directly.
# ============================================================================

# ── Environment ──────────────────────────────────────────────────
environment:
  auto_detect_kaggle: true

# ── Paths ────────────────────────────────────────────────────────
paths:
  # Override these for custom data/output locations.
  # When null, defaults to: {project_root}/data, {project_root}/figures, etc.
  data_dir: null
  processed_dir: null
  figures_dir: null
  results_dir: null
  models_dir: null

# ── Reproducibility ──────────────────────────────────────────────
reproducibility:
  random_seed: 42

# ── Churn Definition ─────────────────────────────────────────────
churn:
  default_window_days: 180
  train_split_quantile: 0.7
  # Strategy: "inactivity" | "subscription" | "cadence_degradation"
  default_strategy: inactivity
  strategies:
    inactivity:
      prediction_window_days: 180
    cadence_degradation:
      multiplier: 2.0  # churn if interval > 2x historical median

# ── Model Hyperparameters ────────────────────────────────────────
models:
  logistic_regression:
    C: 0.1
    max_iter: 1000
    class_weight: balanced
    solver: lbfgs
    n_jobs: -1

  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_leaf: 20
    class_weight: balanced_subsample
    n_jobs: -1

  xgboost:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    n_jobs: -1

# ── Segmentation ─────────────────────────────────────────────────
segmentation:
  n_clusters: 5

# ── Feature Groups ───────────────────────────────────────────────
features:
  standard_groups:
    - purchase
    - monetary
    - inactivity
    - review
    - delivery
    - payment
    - engagement
    - cadence

# ── Ablation ─────────────────────────────────────────────────────
ablation:
  n_splits: 5
  random_state: 42

# ── SHAP ─────────────────────────────────────────────────────────
shap:
  sample_size: 200
  max_display: 20

# ── Calibration ──────────────────────────────────────────────────
calibration:
  n_bins: 10
  n_bootstrap: 200

# ── Plotting ─────────────────────────────────────────────────────
plotting:
  figure_dpi: 150
  savefig_dpi: 300
  font_size: 12

# ── SMOTE ────────────────────────────────────────────────────────
smote:
  enabled: false
  sampling_strategy: auto
  k_neighbors: 5
  random_state: 42

# ── Sensitivity Analysis ────────────────────────────────────────
sensitivity:
  enabled: false
  windows:
    olist: [90, 180, 270]
    rees46: [90, 180, 270]
    retailrocket: [15, 30, 60]
    online_retail_ii: [45, 90, 180]
    instacart: [30, 60, 90]
    telco: []

# ── Validator Thresholds ────────────────────────────────────────
validators:
  max_churn_rate: 0.99
  min_orders_per_customer: 1.05
  max_imbalance_ratio: 100
  min_repeat_purchase_ratio: 0.01
  min_customers: 100
  max_feature_sparsity: 0.95
  auc_variance_warn: 0.15
  min_expected_auc: 0.45
  max_calibration_error: 0.25

# ── Data Quality ─────────────────────────────────────────────────
data_quality:
  check_leakage: true
  min_variance: 0.01
  max_missing_pct: 0.5
  check_timestamps: true
  check_duplicates: true
  check_class_imbalance: true

# ── Timestamp Filtering ──────────────────────────────────────────
timestamps:
  min: '2016-01-01'
  max: '2019-01-01'
  outlier_pricing_percentile: 0.999
  min_samples_per_group: 5

# ── Output ───────────────────────────────────────────────────────
output:
  run_isolation: false
  base_dir: runs

# ── Registered Datasets ──────────────────────────────────────────
# These mirror the Python registry in src/datasets/__init__.py.
# Additional datasets can be added here without modifying Python code.
datasets:
  olist:
    adapter_class: src.datasets.olist.OlistAdapter
    ecosystem_type: transactional_marketplace
    config_file: configs/datasets/olist.yaml

  rees46:
    adapter_class: src.datasets.rees46.REES46Adapter
    ecosystem_type: transactional_marketplace
    config_file: configs/datasets/rees46.yaml

  retailrocket:
    adapter_class: src.datasets.retailrocket.RetailRocketAdapter
    ecosystem_type: clickstream_commerce
    config_file: configs/datasets/retailrocket.yaml

  online_retail_ii:
    adapter_class: src.datasets.online_retail_ii.OnlineRetailIIAdapter
    ecosystem_type: habitual_retail
    config_file: configs/datasets/online_retail_ii.yaml

  instacart:
    adapter_class: src.datasets.instacart.InstacartAdapter
    ecosystem_type: habitual_retail
    config_file: configs/datasets/instacart.yaml

  telco:
    adapter_class: src.datasets.telco.TelcoAdapter
    ecosystem_type: subscription
    config_file: configs/datasets/telco.yaml
