# ============================================================================
# RetailRocket E-commerce — Dataset Manifest
# ============================================================================
# Ecosystem: clickstream_commerce
# Churn window: 30 days
# Customers: ~1.4M | Events: ~2.7M
# Source: https://www.kaggle.com/datasets/retailrocket/ecommerce-dataset
# ============================================================================

adapter:
  type: retailrocket
  plugin: null

root_directory: null

dataset:
  name: retailrocket
  ecosystem_type: clickstream_commerce
  citation: "RetailRocket E-commerce Dataset. Kaggle."
  source_url: "https://www.kaggle.com/datasets/retailrocket/ecommerce-dataset"
  n_customers_approx: 1400000
  n_orders_approx: 2700000

churn:
  strategy: inactivity
  uses_native_churn_label: false
  prediction_window_days: 30
  justification: >
    30 days — RetailRocket spans only ~4.5 months; a longer window
    would consume too much data.

features:
  available_groups:
    - purchase
    - monetary
    - inactivity
    - engagement
    - cadence

schema:
  version: 2
  column_mapping:
    visitorid: customer_id
    timestamp: event_time
    itemid: product_id
    transactionid: session_id
  event_type_mapping:
    view: view
    addtocart: cart_add
    transaction: purchase
  synthetic_columns: {}

files:
  required:
    events: retailrocket_events.csv
  optional:
    items: retailrocket_items.csv
    category_tree: retailrocket_category_tree.csv
    visits: retailrocket_visits.csv

preprocessing: {}
