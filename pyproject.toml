[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnlab"
version = "2.0.0"
description = "Universal Customer Churn Research Framework — onboard, benchmark, explain, and publish churn prediction experiments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Nikhil Wankhede"},
]
keywords = [
    "churn-prediction",
    "customer-churn",
    "machine-learning",
    "behavioral-analytics",
    "e-commerce",
    "reproducible-research",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
full = [
    "shap>=0.44",
    "pingouin>=0.5",
    "statsmodels>=0.14",
    "imbalanced-learn>=0.11",
    "tqdm>=4.65",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=0.10",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

[project.urls]
Homepage = "https://github.com/your-username/churn-research-framework"
Repository = "https://github.com/your-username/churn-research-framework"
Documentation = "https://github.com/your-username/churn-research-framework/tree/main/docs"
Changelog = "https://github.com/your-username/churn-research-framework/blob/main/CHANGELOG.md"

[project.scripts]
churn = "src.cli.main:app"
churnlab = "src.cli.main:app"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
src = [
    "configs/*.yaml",
    "configs/datasets/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
